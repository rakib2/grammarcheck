services:
  app:
    build: .
    ports:
      - "3003:3003"
    env_file:
      - .env.local
    volumes:
      - .:/app
      # Anonymous volumes so host artifacts don't bleed into the Linux container.
      # Without these, a `next build` or `npm install` run on macOS overlays the
      # container's installs/build cache and `next dev` hangs at "Starting…".
      - /app/node_modules
      - /app/.next
